<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yoga</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #f3efe6;
        color: #221e1a;
        font-family: Georgia, serif;
      }
      main {
        width: min(640px, calc(100% - 40px));
        margin: 0 auto;
        padding: 72px 0;
      }
      a { color: inherit; }
      .card {
        display: block;
        margin-top: 8px;
        padding: 22px 0;
        border-top: 1px solid #ddd4c6;
        text-decoration: none;
      }
      small {
        display: block;
        margin-bottom: 6px;
        font-family: "Segoe UI", sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.72rem;
        color: #8a8175;
      }
      h1 { font-weight: 500; font-size: 3rem; margin: 12px 0 28px; }
    </style>
  </head>
  <body>
    <main>
      <small>Yoga</small>
      <h1>Two versions</h1>
      <a class="card" href="./v1/">
        <small>Version one</small>
        The seven poses and Surya Namaskar
      </a>
      <a class="card" href="./v2/">
        <small>Version two</small>
        Vrikshasanam, the tree pose
      </a>
    </main>
  </body>
</html>
